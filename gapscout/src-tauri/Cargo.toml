[package]
name = "gapscout"
version = "0.9.0"
description = "GapScout - Find gaps. Fix flows. A local-first SIPOC workbench."
authors = ["FoundFirst"]
license = "MIT"
repository = "https://github.com/foundfirst/gapscout"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gapscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2"
dirs = "7.0"
